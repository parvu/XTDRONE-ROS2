site_name: XTDrone Manual — ROS 2 Jazzy / Gazebo Harmonic
site_description: XTDrone UAV simulation platform on ROS 2 Jazzy, Gazebo Harmonic and PX4 v1.16.2
repo_url: https://github.com/robin-shaun/XTDrone
docs_dir: docs
site_dir: site
# Plain .html links so the built site works when opened from disk (file://).
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.arithmatex: {generic: true}

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Chapter status: reference/status.md
  - Getting started:
      - 1. Video introduction: getting-started/01-introduction.md
      - 2. Basic configuration: getting-started/02-basic-configuration.md
      - 3. PX4 v1.16.2: getting-started/03-px4-versions.md
      - 3b. ArduPilot branch: getting-started/03a-ardupilot.md
      - 4. Docker: getting-started/04-docker.md
      - 5. Single-direction position hold: getting-started/05-position-hold.md
      - 6. PX4 EKF configuration: getting-started/06-ekf.md
      - 7. Multirotor attitude control: getting-started/07-attitude-control.md
      - 8. Different UAV types: getting-started/08-vehicle-types.md
  - Multi-vehicle and ground vehicles:
      - 9. Multi-vehicle simulation: multi-vehicle/09-multi-vehicle.md
      - 10. Add a vehicle at runtime: multi-vehicle/10-add-vehicle.md
      - 11. UGV configuration: multi-vehicle/11-ugv.md
  - Sensing:
      - 12. Sensor configuration: sensing/12-sensors.md
      - 13. Visual SLAM: sensing/13-vslam.md
      - 14. Visual-inertial odometry: sensing/14-vio.md
