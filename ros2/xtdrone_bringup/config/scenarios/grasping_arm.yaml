# From XTDrone's ROS 1 iris_arm.launch (chapter 33): the iris with the le_arm (iris_arm) next to the
# table with the green cube, at x = -0.1 as in ROS 1 (the ArduPilot iris is as high as the ROS 1 iris; the PX4 x500
# was lower and needed x = 0.1).
world: grasping
vehicles:
  - {model: iris_arm, type: iris, id: 0, pose: [0.1, 0, 0, 0, 0, 0]}
