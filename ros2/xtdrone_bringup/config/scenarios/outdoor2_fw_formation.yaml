# From XTDrone's ROS 1 fixed_wing_formation_control.launch
# (chapter 35): a CAT Vehicle UGV and three standard VTOLs, the leader standard_vtol_0 and two followers.
# ROS 1 started the VTOLs at x = -1500 (ODE's ground plane is infinite). Gazebo Harmonic's DART collides a plane as
# a box about 2100 m wide (+-1050 m): beyond it the vehicles fall. Here they start 600 m west of the UGV.
# The formation nodes read wind, battery and VFR HUD (in the default MAVROS plugin set).
world: outdoor2
vehicles:
  - {model: ugv_nosensor, type: ugv, id: 0, pose: [0, 0, 0, 0, 0, 0]}  # no cameras/lidars: faster simulation
  - {model: standard_vtol, type: standard_vtol, id: 0, pose: [-600, 0, 0, 0, 0, 0]}
  - {model: standard_vtol, type: standard_vtol, id: 1, pose: [-615, -15, 0, 0, 0, 0]}
  - {model: standard_vtol, type: standard_vtol, id: 2, pose: [-615, 15, 0, 0, 0, 0]}
