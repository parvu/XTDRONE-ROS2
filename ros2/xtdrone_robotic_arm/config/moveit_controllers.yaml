# MoveIt 2 -> ros2_control (ROS 1: le_arm_moveit_config/config/controllers_gazebo.yaml). move_group runs in the
# namespace of the vehicle (iris_0), next to the controllers.
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_simple_controller_manager:
  controller_names: [le_arm_controller, gripper_controller]
  le_arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint]
  gripper_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [left_knuckle_joint]
